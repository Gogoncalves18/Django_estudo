{% extends "lista_tarefas/base.html" %}

{% block content %}
<h3>Tarefas:</h3>

<ul>

    {% for topico in topicos_lista %}
    <li> <a href="{% url 'sub_topicos_tarefas' topico.id %}">{{ topico }}</a> </li>
    {% empty %}
    <li>Não há tarefas!</li>
    {% endfor %}
</ul>

<!-- Envio para rota que cairá no formulário -->
<a href="{% url 'novo_topico' %}">Adicionar novo tópico</a>

{% endblock content %}
