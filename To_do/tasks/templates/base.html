<!-- Carrega os arquivos estaticos, importante, este base está dentro do 
 app tasks, então os arquivos de static precisam estar lá dentro -->
{% load static %} 

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>

    <!-- Aqui carrego o bootstrap que peguei neste linK:
     https://getbootstrap.com/docs/5.3/getting-started/introduction/#html5-doctype -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Carregamento do fontawesome -->
    <script src="https://kit.fontawesome.com/4991e1826c.js" crossorigin="anonymous"></script>

    <!-- Maneiro que carrego os arquivos statics -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    
    <!-- Conteúdo do bootstrap -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">TO-DO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Tarefas</a>
        </li>               
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Usuários</a>
        </li>               
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Sobre nós</a>
        </li>               
      </ul>      
    </div>
  </div>
</nav>

    {% block content %} 
  
   
    
    {% endblock %}
    <footer>

        <p>Estudando via Hora de Codar ToDo.</p>
    </footer>

    <!-- Aqui carrego o bootstrap que peguei neste linK:
     https://getbootstrap.com/docs/5.3/getting-started/introduction/#html5-doctype -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Aqui é a forma de carregar os arquivos de scripts -->
    <script src="{% static 'js/scripts.js' %}"></script>
    
</body>
</html>
